<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730"
     role="img" aria-labelledby="title desc">
  <title id="title">Blast Radius Zero architecture and trust boundaries</title>
  <desc id="desc">Browser talks to a FastAPI control plane over HTTPS and SSE. The control plane holds the
  inference key and the Docker socket, calls Vultr Serverless Inference over HTTPS with a bearer key, and
  starts one disposable container per step with no network, a read-only rootfs, uid 65534 and no
  capabilities. Container output and artifacts land in a SQLite ledger. The control plane is labelled the
  weakest link.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .h1   { font-size: 20px; font-weight: 600; fill: #e6edf3; }
      .sub  { font-size: 12.5px; fill: #8b949e; }
      .box  { font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .body { font-size: 11.5px; fill: #c9d1d9; }
      .dim  { font-size: 10.5px; fill: #8b949e; }
      .flag { font-size: 11px; fill: #c9d1d9; }
      .edge { font-size: 11px; fill: #8b949e; }
      .bnd  { font-size: 10px; fill: #8b949e; letter-spacing: 1.2px; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="960" height="730" fill="#0d1117"/>

  <text x="36" y="40" class="sans h1">Blast Radius Zero — architecture and trust boundaries</text>
  <text x="36" y="62" class="sans sub">One control plane, one disposable container per step, one ledger. Every arrow crosses a boundary where trust changes.</text>

  <!-- ============ browser ============ -->
  <rect x="36" y="100" width="190" height="86" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="56" y="126" class="sans bnd">BROWSER</text>
  <text x="56" y="149" class="sans body">Console · Lab · Ledger</text>
  <text x="56" y="169" class="sans dim">task text ≤ 4 000 chars</text>

  <!-- browser -> control plane -->
  <line x1="226" y1="143" x2="302" y2="143" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="232" y="135" class="sans edge">HTTPS + SSE</text>

  <!-- host trust boundary -->
  <rect x="292" y="80" width="470" height="160" rx="12" fill="none" stroke="#8b949e"
        stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="304" y="76" class="sans bnd">HOST TRUST BOUNDARY — ROOT-EQUIVALENT</text>

  <!-- control plane -->
  <rect x="310" y="92" width="434" height="136" rx="10" fill="#101a2b" stroke="#2f81f7" stroke-width="1.5"/>
  <text x="326" y="118" class="sans box">CONTROL PLANE — FastAPI, one process</text>
  <text x="326" y="140" class="sans body">plan → dispatch → verify loop · SSE event bus</text>
  <text x="326" y="161" class="sans body">holds <tspan class="mono flag">INFERENCE_API_KEY</tspan> in process memory</text>
  <text x="326" y="182" class="sans body">holds <tspan class="mono flag">/var/run/docker.sock</tspan> — root-equivalent</text>
  <text x="326" y="203" class="sans dim">MAX_STEPS=5 · 2 concurrent runs · per-IP rate limits · SQLite WAL ledger</text>

  <!-- weakest link badge -->
  <rect x="760" y="20" width="166" height="26" rx="13" fill="#3d1214" stroke="#f85149" stroke-width="1.3"/>
  <text x="843" y="37" text-anchor="middle" class="sans bnd" fill="#ff7b72" font-size="10.5" font-weight="600">WEAKEST LINK</text>

  <!-- ============ inference ============ -->
  <rect x="60" y="330" width="320" height="132" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.3"/>
  <text x="78" y="356" class="sans bnd">VULTR SERVERLESS INFERENCE</text>
  <text x="78" y="380" class="sans body"><tspan class="mono flag">POST /chat/completions</tspan> (OpenAI-compatible)</text>
  <text x="78" y="400" class="sans body">model <tspan class="mono flag">glm-5.3</tspan> · planner and verifier</text>
  <text x="78" y="420" class="sans dim">JSON decisions, verdicts; no task data retained by us</text>
  <text x="78" y="443" class="sans flag">HTTPS · <tspan class="mono">Authorization: Bearer &lt;key&gt;</tspan></text>

  <!-- control plane -> inference (elbow) -->
  <path d="M 420 228 L 420 306 L 220 306 L 220 328" fill="none" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="232" y="298" class="sans edge">HTTPS + Bearer key</text>

  <!-- ============ sandbox ============ -->
  <rect x="560" y="320" width="372" height="252" rx="12" fill="none" stroke="#3fb950"
        stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="572" y="312" class="sans bnd" fill="#3fb950">SANDBOX BOUNDARY</text>
  <text x="572" y="566" class="sans bnd" fill="#3fb950">UNTRUSTED CODE — NO HOST, NO NETWORK, NO SECRET</text>

  <rect x="578" y="344" width="336" height="210" rx="10" fill="#0d1c14" stroke="#3fb950" stroke-width="1.4"/>
  <text x="596" y="370" class="sans box">PER-STEP CONTAINER</text>
  <text x="596" y="390" class="sans dim">created per step · destroyed after the step · never reused</text>
  <text x="596" y="412" class="sans body"><tspan class="mono flag">--network none</tspan> · rootfs read-only</text>
  <text x="596" y="432" class="sans body"><tspan class="mono flag">uid 65534</tspan> · <tspan class="mono flag">--cap-drop ALL</tspan> · no-new-privileges</text>
  <text x="596" y="452" class="sans body">256 MB · 0.5 CPU · 64 PIDs · 20 s wall clock</text>
  <text x="596" y="472" class="sans body">writable: <tspan class="mono flag">/tmp</tspan> (tmpfs 16 MB) + <tspan class="mono flag">/out</tspan> (per-step bind)</text>
  <text x="596" y="492" class="sans body">gVisor <tspan class="mono flag">runsc</tspan> when available, <tspan class="mono flag">runc</tspan> otherwise</text>
  <text x="596" y="512" class="sans dim">no key, no host mounts, no network device, no shell</text>
  <text x="596" y="534" class="sans dim">watchdogs: 200 KB output · 64 MB /out · 32 MB file</text>

  <!-- control plane -> sandbox (elbow) -->
  <path d="M 620 228 L 620 276 L 744 276 L 744 342" fill="none" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="632" y="268" class="sans edge">docker CLI · local socket</text>

  <!-- ============ ledger ============ -->
  <rect x="560" y="614" width="372" height="86" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.2"/>
  <text x="578" y="640" class="sans bnd">LEDGER — SQLITE (WAL)</text>
  <text x="578" y="662" class="sans body">runs · steps · probes — exit code, duration, verdict</text>
  <text x="578" y="684" class="sans dim" font-size="10">data/brz.sqlite3 · artifacts under data/artifacts/&lt;run&gt;/</text>

  <!-- sandbox -> ledger -->
  <line x1="800" y1="572" x2="800" y2="610" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="788" y="588" text-anchor="end" class="sans edge">stdout / stderr / exit code · files under /out</text>
  <text x="788" y="602" text-anchor="end" class="sans dim">enumerated after the container is gone</text>

  <!-- ============ notes ============ -->
  <rect x="36" y="492" width="470" height="208" rx="10" fill="#11161d" stroke="#30363d"/>
  <text x="54" y="516" class="sans bnd">WHAT CROSSES EACH BOUNDARY</text>
  <text x="54" y="542" class="sans body"><tspan fill="#e6edf3">browser → API</tspan>  task text in; SSE events and artifacts out</text>
  <text x="54" y="566" class="sans body"><tspan fill="#e6edf3">model → control plane</tspan>  untrusted text; parsed as one JSON</text>
  <text x="54" y="582" class="sans body">object, and only its <tspan class="mono flag">code</tspan> field reaches execution</text>
  <text x="54" y="606" class="sans body"><tspan fill="#e6edf3">control plane → sandbox</tspan>  one program on stdin; stdout,</text>
  <text x="54" y="622" class="sans body">stderr, exit code and up to 25 artifact entries back</text>
  <text x="54" y="646" class="sans body"><tspan fill="#e6edf3">control plane → daemon</tspan>  root-equivalent: a compromised</text>
  <text x="54" y="662" class="sans body">control plane is a compromised host — docs/security.md §4</text>

  <!-- footer -->
  <text x="924" y="718" text-anchor="end" class="sans dim">README §3 · docs/architecture.md §3</text>
</svg>
